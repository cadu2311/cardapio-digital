<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger & Cia | Cardápio Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: #1e1e1e; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #25D366; font-size: 24px; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .item { background: #2a2a2a; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .item-info h3 { font-size: 16px; margin-bottom: 4px; }
        .item-info p { color: #aaa; font-size: 12px; }
        .item-info span { color: #25D366; font-weight: bold; font-size: 15px; display: block; margin-top: 4px; }
        .btn-add { background: #25D366; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .cart-section { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #ddd; }
        .total { font-size: 18px; font-weight: bold; margin-top: 15px; text-align: right; color: #25D366; }
        input, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 14px; }
        .btn-send { width: 100%; background: #25D366; color: #000; font-size: 16px; font-weight: bold; padding: 14px; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 Burger & Cia</h1>
    <p class="subtitle">Faça seu pedido direto pelo WhatsApp</p>

    <div id="menu"></div>

    <div class="cart-section">
        <h2>🛒 Seu Pedido</h2>
        <div id="cart-items" style="margin-top: 10px;"></div>
        <div class="total" id="total-price">Total: R$ 0,00</div>

        <input type="text" id="nome" placeholder="Seu Nome Completo">
        <input type="text" id="endereco" placeholder="Endereço de Entrega (Rua, Nº, Bairro)">
        <select id="pagamento">
            <option value="PIX">Forma de Pagamento: PIX</option>
            <option value="Cartão">Forma de Pagamento: Cartão</option>
            <option value="Dinheiro">Forma de Pagamento: Dinheiro</option>
        </select>

        <button class="btn-send" onclick="enviarWhatsApp()">🚀 Enviar Pedido no WhatsApp</button>
    </div>
</div>

<script>
    const TELEFONE = "5544999999999"; // Coloque o numero do cliente aqui

    const MENU = [
        { id: 1, nome: "X-Burger Artesanal", desc: "Pão, hambúrguer 180g e queijo", preco: 25.00 },
        { id: 2, nome: "X-Salada Especial", desc: "Pão, burguer, queijo, salada e maionese", preco: 22.00 },
        { id: 3, nome: "Batata Frita Porção", desc: "Batata crocante 200g", preco: 12.00 },
        { id: 4, nome: "Refrigerante Lata", desc: "350ml bem gelado", preco: 6.00 }
    ];

    let carrinho = [];

    function renderMenu() {
        const menuDiv = document.getElementById('menu');
        menuDiv.innerHTML = MENU.map(item => `
            <div class="item">
                <div class="item-info">
                    <h3>${item.nome}</h3>
                    <p>${item.desc}</p>
                    <span>R$ ${item.preco.toFixed(2).replace('.', ',')}</span>
                </div>
                <button class="btn-add" onclick="addAoCarrinho(${item.id})">➕ Add</button>
            </div>
        `).join('');
    }

    function addAoCarrinho(id) {
        const item = MENU.find(prod => prod.id === id);
        carrinho.push(item);
        atualizarCarrinho();
    }

    function atualizarCarrinho() {
        const cartDiv = document.getElementById('cart-items');
        if (carrinho.length === 0) {
            cartDiv.innerHTML = '<p style="color:#888;">O carrinho está vazio.</p>';
            document.getElementById('total-price').innerText = 'Total: R$ 0,00';
            return;
        }

        let total = 0;
        cartDiv.innerHTML = carrinho.map((item, index) => {
            total += item.preco;
            return `<div class="cart-item">
                <span>• ${item.nome}</span>
                <span>R$ ${item.preco.toFixed(2).replace('.', ',')}</span>
            </div>`;
        }).join('');

        document.getElementById('total-price').innerText = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function enviarWhatsApp() {
        const nome = document.getElementById('nome').value;
        const endereco = document.getElementById('endereco').value;
        const pagamento = document.getElementById('pagamento').value;

        if (!nome || !endereco) {
            alert('Por favor, preencha seu nome e endereço!');
            return;
        }

        if (carrinho.length === 0) {
            alert('Adicione pelo menos um item ao carrinho!');
            return;
        }

        let textoItens = carrinho.map(i => `- ${i.nome} (R$ ${i.preco.toFixed(2).replace('.', ',')})`).join('%0A');
        let total = carrinho.reduce((sum, i) => sum + i.preco, 0);

        let mensagem = `*NOVO PEDIDO*%0A%0A*Cliente:* ${nome}%0A*Endereço:* ${endereco}%0A*Pagamento:* ${pagamento}%0A%0A*Itens:*%0A${textoItens}%0A%0A*Total:* R$ ${total.toFixed(2).replace('.', ',')}`;

        window.open(`https://wa.me/${TELEFONE}?text=${mensagem}`, '_blank');
    }

    renderMenu();
    atualizarCarrinho();
</script>

</body>
</html>
